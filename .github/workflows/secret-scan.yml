# No private key in the tree, whatever the file is called.
#
# .gitignore refuses `*.key`; this refuses the CONTENT on every pull request
# and push to main, because a key pasted into a differently named file, a
# fixture or a doc is just as leaked. The updater key signs every update every
# user installs, so a key found here must be treated as compromised and
# rotated, not merely deleted: git history keeps it.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: no private key material
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: refuse private key material
        run: |
          # minisign/tauri secret keys, as text and as the base64 a tauri
          # .key file wraps them in, and PEM private keys of any kind.
          patterns='rsign encrypted secret key|minisign encrypted secret key'
          patterns="$patterns|dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5"
          patterns="$patterns|dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5"
          patterns="$patterns|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"
          if git grep -nIE "$patterns" -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::private key material is tracked. Remove it AND rotate the key: history keeps it."
            exit 1
          fi
          echo "no private key material tracked"
