# The vendored Esplora stack under deploy/esplora: rust-btx (pure Rust, a
# minute) and electrs (rocksdb compiled from source, long). Both run only when
# those trees change, so an unrelated pull request pays nothing.
#
# Same trust boundary as ci.yml: read-only token, no secrets, no
# pull_request_target. Action pins are the same commit SHAs ci.yml uses; see
# its header for why a tag is not enough.
name: Esplora stack

on:
  pull_request:
    paths:
      - 'deploy/esplora/**'
      - 'scripts/verify-esplora.sh'
      - '.github/workflows/esplora.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/esplora/**'
      - 'scripts/verify-esplora.sh'
      - '.github/workflows/esplora.yml'

permissions:
  contents: read

concurrency:
  group: esplora-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The hand-ported shell: parse every script, and let shellcheck refuse the
  # error class (unquoted globs in rm, unreachable code, that family).
  scripts:
    name: deploy scripts (parse, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: for f in deploy/esplora/*.sh scripts/verify-esplora.sh; do bash -n "$f"; done
      - run: shellcheck -S error deploy/esplora/*.sh scripts/verify-esplora.sh
      # The freshness guardian, actually run. Its rules are documented as
      # identical to crates/btx-core/src/esplora_freshness.rs, and "change one
      # and change the other" is not a mechanism. Stubs only: no node, no
      # chain, no network.
      - run: deploy/esplora/test-guardian.sh

  # The Caddy front, actually started and asked what it does. Until this job
  # existed the configuration had never been run: the three freshness states,
  # "CORS exactly once" and "btxd's RPC stays unreachable" were comments. The
  # first run of it found a rate limit that was ordered after a directive which
  # terminates routing, so it never ran at all.
  #
  # It needs a Caddy carrying the rate-limit plugin, which no distribution
  # ships, so the job builds one with xcaddy. Everything else is stubs on
  # localhost: no node, no chain, no network.
  front:
    name: Caddy front (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'
          cache: false
      - name: Build caddy with the rate-limit plugin
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          "$HOME/go/bin/xcaddy" build --with github.com/mholt/caddy-ratelimit \
            --output "$HOME/.local/bin/caddy"
          "$HOME/.local/bin/caddy" list-modules | grep -qx 'http.handlers.rate_limit'
      - name: Run the front against stubs
        run: deploy/esplora/test-front.sh

  rust-btx:
    name: rust-btx (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/esplora/rust-btx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: deploy/esplora/rust-btx
      - run: cargo test --locked --all-targets

  # `cargo check` still runs librocksdb-sys's build script, which compiles
  # rocksdb, so this is the slow job. rust-toolchain.toml in the directory pins
  # the toolchain and rustup on the runner installs it.
  electrs:
    name: electrs (check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deploy/esplora/electrs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: deploy/esplora/electrs
      - run: cargo check --locked --bin electrs
