name: Bug
description: Something is broken or does not do what it says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste a private key, a seed phrase, a wallet address or a
        balance. Nothing we need to fix a bug requires any of them.

        Security issues do not go here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: os
    attributes:
      label: OS, architecture, and easyNode version
      placeholder: macOS 15.2, arm64, easyNode 0.6.17
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Anything the app or the node printed
      render: text
